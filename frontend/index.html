<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      SL Labs | Botanical Hair Care & HairGlow Products
    </title>

    <meta
      name="description"
      content="Discover HairGlow Hair Oil and Botanical Hair Spray by SL Labs, along with rose water and botanical personal-care essentials for your daily routine."
    />

    <meta name="robots" content="index, follow" />

    <meta name="author" content="SL Labs" />

    <meta name="theme-color" content="#F8F6F2" />

    <!-- Canonical URL: use only after confirming the preferred live domain -->
    <link rel="canonical" href="https://sllabscare.in/" />

    <!-- Open Graph: social sharing previews -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="SL Labs | Botanical Hair Care & HairGlow Products"
    />

    <meta
      property="og:description"
      content="Explore HairGlow Hair Oil, Botanical Hair Spray, and botanical personal-care essentials from SL Labs."
    />

    <meta
      property="og:url"
      content="https://sllabscare.in/"
    />

    <!-- Replace with an absolute URL to your actual homepage sharing image -->
    <meta
      property="og:image"
      content="https://sllabscare.in/images/sl-labs-social-share.jpg"
    />

    <!-- Favicon: update paths to match files in your public directory -->
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />

    <!-- Font optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
